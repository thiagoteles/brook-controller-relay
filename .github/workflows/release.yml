name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Brook Controller Relay ${{ github.ref_name }}'
          releaseBody: |
            ## Brook Controller Relay ${{ github.ref_name }}

            ### Installation
            1. Download the `.dmg` file for your Mac below
            2. Open the `.dmg` and drag **Brook Controller Relay** to Applications
            3. On first launch, right-click → Open (to bypass Gatekeeper)

            **Apple Silicon (M1/M2/M3/M4):** `_aarch64.dmg`
            **Intel Macs:** `_x64.dmg`

            ### What's New
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
